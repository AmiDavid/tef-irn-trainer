name: Validate app

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check connected.js
          for f in api/*.js; do node --check "$f"; done
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f data.js
          test -f manifest.webmanifest
      - name: Run content QA
        run: node --input-type=commonjs < qa/content-qa.txt
      - name: Run static QA
        run: node --input-type=commonjs < qa/static-qa.txt
      - name: Install UI QA dependency
        run: npm install --ignore-scripts
      - name: Install Chromium for QA
        run: npx playwright install chromium
      - name: Run Android-sized UI QA
        run: node --input-type=commonjs < qa/ui-qa.txt
