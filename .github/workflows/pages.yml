name: Deploy TEF B2 Coach

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check app.js
          node --check connected.js
      - name: Content QA
        run: node qa/content-qa.txt
      - name: Static QA
        run: node qa/static-qa.txt
      - name: Install UI QA dependency
        run: npm install --ignore-scripts
      - name: Install Chromium for QA
        run: npx playwright install chromium
      - name: Android-sized UI QA
        run: node qa/ui-qa.txt

  deploy:
    needs: qa
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
