name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check app.js
          node --check connected.js
      - name: Content QA
        run: node qa/content-qa.txt
      - name: Static QA
        run: node qa/static-qa.txt
      - name: Install UI QA dependency
        run: npm install --ignore-scripts
      - name: Install Chromium for QA
        run: npx playwright install chromium
      - name: Android-sized UI QA
        run: node qa/ui-qa.txt

  build:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TEF-B2-Coach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TEF-B2-Coach-Android
          path: TEF-B2-Coach.apk
          retention-days: 30
